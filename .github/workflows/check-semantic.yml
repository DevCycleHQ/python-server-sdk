name: Semantic PR
on:
  # pull_request, not pull_request_target: GitHub never starts pull_request_target
  # runs for PRs opened with GITHUB_TOKEN (release-please), but it does start
  # pull_request runs, which wait for approval like the other checks.
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  pull-requests: read
jobs:
  check_title:
    name: Semantic PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
